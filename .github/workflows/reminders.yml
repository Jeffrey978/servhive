# Hourly reminder + auto-release sweep (A.6, A.8).
#
# Vercel's Hobby plan only allows daily cron jobs, so vercel.json runs the
# sweep once a day (08:00 Lagos). This workflow calls the same endpoint every
# hour so the "~24h" and "~3h before auto-release" reminders land on time. The
# sweep is idempotent (SentReminder de-dups; auto-release is status-guarded),
# so overlapping with the daily Vercel run is harmless.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      the production URL, e.g. https://servhive.com (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel's environment variables
# Until both exist the job exits early and does nothing.
# GitHub runs scheduled workflows from the default branch only (after merge).
name: Reminders sweep

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; skipping (the daily Vercel cron still runs)."
            exit 0
          fi
          curl -fsS --max-time 60 -o /dev/null -w "sweep: HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
